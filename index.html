<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reward Notice - Confirm Your Claim</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    background-color: #111111; /* Latar belakang hitam pekat */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    overflow: hidden;
  }

  /* Kotak Modal Gelap */
  .modal {
    background-color: #222222; /* Abu-abu gelap */
    border: 1px solid rgba(255, 255, 255, 0.08); /* Garis batas tipis */
    border-radius: 14px;
    padding: 40px 30px 30px;
    width: 100%;
    max-width: 480px;
    text-align: center;
    box-shadow: 0 10px 50px rgba(0, 0, 0, 0.8);
  }

  /* Label Atas */
  .notice-label {
    color: #fbbf24; /* Warna emas */
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 12px;
    display: block;
  }

  /* Judul Utama */
  h1 {
    color: #ffffff;
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 14px;
    letter-spacing: -0.3px;
  }

  /* Subteks */
  .desc {
    color: #d1d5db; /* Abu-abu terang */
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 28px;
  }

  /* Kontainer Timer */
  .timer-wrap {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 15px;
    margin-bottom: 8px;
  }
  .t-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 55px;
  }
  .t-num {
    font-size: 34px;
    font-weight: 800;
    color: #fde047; /* Kuning terang untuk angka */
    font-variant-numeric: tabular-nums;
  }
  .t-sep {
    font-size: 26px;
    font-weight: 400;
    color: #555555;
    margin-top: 2px;
  }
  .t-lbl {
    font-size: 10px;
    color: #9ca3af;
    margin-top: 6px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  /* Teks Bawah Timer */
  .expire-msg {
    color: #9ca3af;
    font-size: 12px;
    margin-bottom: 28px;
  }

  /* Tombol-tombol */
  .btn-wrap {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
  }
  .btn {
    flex: 1;
    padding: 16px 10px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 700;
    border: none;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  /* Tombol Kiri (Kuning/Emas) */
  .btn-pri {
    background-color: #fde047;
    color: #1c1917;
    box-shadow: 0 4px 15px rgba(253, 224, 71, 0.15);
  }
  .btn-pri:hover {
    background-color: #fef08a;
    transform: translateY(-2px);
  }

  /* Tombol Kanan (Abu-abu Gelap) */
  .btn-sec {
    background-color: #3f3f46;
    color: #ffffff;
  }
  .btn-sec:hover {
    background-color: #52525b;
    transform: translateY(-2px);
  }

  /* Footer Links */
  .footer {
    font-size: 11px;
    color: #71717a;
  }
  .footer a {
    color: #71717a;
    text-decoration: underline;
    margin: 0 4px;
  }
  .footer a:hover {
    color: #a1a1aa;
  }

  /* Responsif HP */
  @media (max-width: 400px) {
    .btn-wrap {
      flex-direction: column;
    }
    .modal {
      padding: 35px 20px 25px;
    }
    .t-num { font-size: 28px; }
    .t-box { min-width: 45px; }
  }
</style>
</head>
<body>

  <div class="modal">
    <span class="notice-label">REWARD NOTICE</span>
    <h1>Your $500 Cash is Waiting</h1>
    <p class="desc">Your digital cash spot is reserved. Confirm your claim now before your timer expires and the reward is passed on.</p>
    
    <div class="timer-wrap">
      <div class="t-box">
        <span class="t-num" id="tHours">23</span>
        <span class="t-lbl">HRS</span>
      </div>
      <span class="t-sep">:</span>
      <div class="t-box">
        <span class="t-num" id="tMins">59</span>
        <span class="t-lbl">MIN</span>
      </div>
      <span class="t-sep">:</span>
      <div class="t-box">
        <span class="t-num" id="tSecs">59</span>
        <span class="t-lbl">SEC</span>
      </div>
    </div>

    <div class="expire-msg">Offer Expires Soon</div>

    <div class="btn-wrap">
      <a href="#" id="btnContinue" class="btn btn-pri">Continue &rarr;</a>
      <a href="#" id="btnCancel" class="btn btn-sec">Cancel</a>
    </div>

    <div class="footer">
      <a href="#">Privacy</a> | <a href="#">Legal</a> | <a href="#">Terms</a>
    </div>
  </div>

<script>
// Menunggu file HTML selesai dimuat agar fungsi tidak macet
document.addEventListener('DOMContentLoaded', function() {
  
  // ===== SMARTLINK ADSTERRA ANDA =====
  const SMARTLINK = "https://www.profitableratecpmnetwork.com/i22pjqip?key=3d90b365c9b4251e864b586b01809e74
";
  // ===================================

  // 1. Fungsi Paksa Redirect untuk Kedua Tombol (Continue & Cancel)
  const btnContinue = document.getElementById('btnContinue');
  const btnCancel = document.getElementById('btnCancel');

  function forceRedirect(e) {
    e.preventDefault(); 
    window.location.href = SMARTLINK; 
  }

  if (btnContinue) btnContinue.addEventListener('click', forceRedirect);
  if (btnCancel) btnCancel.addEventListener('click', forceRedirect);

  // 2. Countdown Timer Mundur dari 24 Jam (86400 Detik)
  let totalSeconds = 86400; // Total 24 Jam

  function pad(n) {
    return String(n).padStart(2, '0'); // Tambahkan 0 di depan angka satuan (misal: 09)
  }

  function updateTimer() {
    if (totalSeconds > 0) totalSeconds--;
    
    // Perhitungan Jam, Menit, Detik
    let h = Math.floor(totalSeconds / 3600);
    let m = Math.floor((totalSeconds % 3600) / 60);
    let s = totalSeconds % 60;
    
    // Update ke layar HTML
    document.getElementById('tHours').textContent = pad(h);
    document.getElementById('tMins').textContent = pad(m);
    document.getElementById('tSecs').textContent = pad(s);
  }

  // Mulai Timer Segera
  updateTimer();
  setInterval(updateTimer, 1000);
  
});
</script>
</body>
</html>
